name: Build and deploy production backend

# The restricted in-cluster controller pulls successful production builds.
# GitHub never receives cluster credentials or private tailnet access.
on:
  workflow_dispatch:
  push:
    branches: [production]
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: html2md-production-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build immutable Kubernetes candidate
    if: github.repository == 'traylinx/2md' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify qualified dependency lock
        run: echo '83fa6a8e56d0d10c39ca314eb0c7a47f97e86d28e17bb989690069954fec27df  package-lock.json' | sha256sum --check
      - name: Focused legacy regression tests
        run: node --max-old-space-size=128 --test --test-concurrency=1 tests/legacy-capture-repair.test.cjs tests/legacy-deploy.test.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/legacy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/traylinx/2md:legacy-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Record immutable candidate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Candidate: ghcr.io/traylinx/2md@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA. In-cluster controller promotes successful production builds; the next job verifies the live revision." >> "$GITHUB_STEP_SUMMARY"

  capture-build:
    name: Build private capture candidate
    if: github.repository == 'traylinx/2md' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Focused capture delivery tests
        run: node --max-old-space-size=128 --test --test-concurrency=1 tests/capture-deploy.test.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Require existing private package before uploading any image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api /orgs/traylinx/packages/container/2md-capture --jq .visibility)" = private
      - name: Build and publish private immutable capture image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/capture/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/traylinx/2md-capture:capture-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Require private package before controller promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(gh api /orgs/traylinx/packages/container/2md-capture --jq .visibility)" = private
          echo "Private candidate: ghcr.io/traylinx/2md-capture@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  verify-deployment:
    name: Verify automatic Kubernetes deployment
    needs: [build, capture-build]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.repository == 'traylinx/2md' && github.ref == 'refs/heads/production'
    steps:
      - name: Wait for exact deployed revision and healthy API
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_REVISION']
          for _ in range(120):
              try:
                  request = urllib.request.Request(
                      'https://api.2md.traylinx.com/api/health?release-check=' + str(time.time_ns()),
                      headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      if (response.status == 200
                              and response.headers.get('X-2md-Revision') == expected
                              and response.headers.get('X-2md-Deployment') == 'verified'
                              and response.headers.get('X-2md-Capture-Revision') == expected
                              and json.load(response).get('status') == 'ok'):
                          print('Production API reports expected healthy revision: ' + expected)
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Automatic deployment did not become healthy; inspect html2md-auto-deploy jobs. No credentials or manual deployment used by this workflow.')
          PYVERIFY
