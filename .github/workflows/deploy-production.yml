name: Build production backend image

# The old SSH/Compose host is retired. Kubernetes promotion remains explicit;
# never send cluster credentials to a runner for this public repository.
on:
  workflow_dispatch:
  push:
    branches: [production]
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: html2md-production-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build immutable Kubernetes candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify qualified dependency lock
        run: echo '83fa6a8e56d0d10c39ca314eb0c7a47f97e86d28e17bb989690069954fec27df  package-lock.json' | sha256sum --check
      - name: Focused legacy regression tests
        run: node --max-old-space-size=128 --test --test-concurrency=1 tests/legacy-capture-repair.test.cjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/legacy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/traylinx/2md:legacy-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Record candidate (not deployment)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Candidate: ghcr.io/traylinx/2md@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA. NOT automatically deployed; follow deploy/legacy/README.md." >> "$GITHUB_STEP_SUMMARY"
